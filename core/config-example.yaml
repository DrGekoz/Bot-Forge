bot_token: "YOUR_BOT_TOKEN_HERE"
client_id: "YOUR_CLIENT_ID_HERE"
status_message: "Bot-Forge 🎮"

# — LLM Provider —
providers:
  main:
    base_url: "http://localhost:1234/v1"
    api_key: ""
    model: ""

# — TTS (PocketTTS) —
tts:
  server_url: "http://localhost:8769"
  voice_ref: "voice-refs/default.wav"

# — Permissions —
permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

# — Bot Settings —
max_text: 100000
max_images: 5
max_messages: 3
use_plain_responses: true
allow_dms: false
message_content_intent: true
